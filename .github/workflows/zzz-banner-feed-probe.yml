name: ZZZ B1 discovered feed gate
# Temporary PR-scoped follow-up, removed after this capture; no repeated URLs.
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/zzz-banner-b1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun scripts/probe-zzz-banner-feed.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zzz-b1-feed-probe
          path: source-probes/zzz-b1-feed/
          retention-days: 7
