name: ZZZ B1 candidate access gate
# One bounded capture on opening this same-repository research PR; no scheduler.
# Removed before delivery. Further rounds must use new surfaces or wait >=6h.
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/zzz-banner-b1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun scripts/probe-zzz-banners.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zzz-b1-source-probe
          path: source-probes/zzz-b1/
          retention-days: 7
