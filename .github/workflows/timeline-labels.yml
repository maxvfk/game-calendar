name: Timeline labels

# Autonomous Timeline naming (docs/tasks/TIMELINE-LABEL-AUTONOMOUS.md). Asks the selected model
# once, records the accepted decisions and runs CI on the recorded commit.
#
# Scheduled runs write to main, and so deploy, only while the repository variable
# TIMELINE_LABELS_AUTO is "on"; otherwise they are skipped. A manual run targets the
# disposable timeline-labels/rehearsal branch unless "main" is chosen, which needs the
# same switch. Pages deploys only from main, so a rehearsal never reaches the site.
on:
  # Tue and Sat 07:23 Moscow (04:23 UTC): after the night, so an evening's usage window
  # has reset, and on Saturday after the weekly reset at 04:00.
  schedule:
    - cron: "23 4 * * 2,6"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to record (main needs TIMELINE_LABELS_AUTO=on)"
        type: choice
        options: [rehearsal, main]
        default: rehearsal
      model:
        description: "Model provider (Claude requires working OAuth)"
        type: choice
        options: [deepseek-flash, sonnet, opus]
        default: deepseek-flash

concurrency:
  group: timeline-labels
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ (github.event_name == 'schedule' || inputs.target == 'main') && 'main' || 'timeline-labels/rehearsal' }}
  # Manual selection overrides the scheduled repository variable.
  MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || vars.TIMELINE_LABEL_MODEL || 'deepseek-flash' }}

jobs:
  # Read-only. The only job that sees the Claude token.
  propose:
    # The kill switch: nothing targets main unless TIMELINE_LABELS_AUTO is "on".
    if: >-
      github.repository == 'maxvfk/game-calendar' &&
      ((github.event_name == 'workflow_dispatch' && inputs.target != 'main') ||
       vars.TIMELINE_LABELS_AUTO == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      events: ${{ steps.queue.outputs.events }}
      limited: ${{ steps.model.outputs.limited }}
    env:
      CLAUDE_CODE_VERSION: "2.1.310"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - name: Build feed and agent input
        run: bun run build:feed

      - name: Validate model selection
        run: |
          case "$MODEL" in
            deepseek-flash|sonnet|opus) ;;
            *) echo "::error::Unsupported model: $MODEL"; exit 1 ;;
          esac

      - name: Queue size
        id: queue
        run: |
          set -euo pipefail
          mkdir -p labels
          cp public/data/timeline-label-agent-input.v1.json labels/agent-input.json
          echo "events=$(jq '.events | length' labels/agent-input.json)" >> "$GITHUB_OUTPUT"
          jq -c '.counts' labels/agent-input.json

      # An empty queue never calls the model.
      - name: Install Claude Code CLI (pinned)
        if: steps.queue.outputs.events != '0' && env.MODEL != 'deepseek-flash'
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A subscription limit sets limited=true and skips the rest; nothing is written.
      - name: Ask Claude for decisions
        id: model
        if: steps.queue.outputs.events != '0' && env.MODEL != 'deepseek-flash'
        env:
          RAW_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/timeline-label-agent/run-model.sh labels/agent-input.json labels/claude-result.json

      - name: Extract Claude proposals
        if: steps.queue.outputs.events != '0' && env.MODEL != 'deepseek-flash' && steps.model.outputs.limited != 'true'
        run: |
          set -euo pipefail
          if ! jq -e '.subtype == "success" and .structured_output != null' labels/claude-result.json > /dev/null; then
            echo "::error::No structured output (subtype: $(jq -r '.subtype' labels/claude-result.json))"
            exit 1
          fi
          jq '.structured_output' labels/claude-result.json > labels/proposals.json

      # Preserve the authoritative main feed. During a manual prerelease
      # rehearsal only, load the selected branch's runner separately: main may
      # not have it yet. The record job still checks out fresh main.
      - name: Checkout selected DeepSeek runner for branch preview
        if: steps.queue.outputs.events != '0' && env.MODEL == 'deepseek-flash' && github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .timeline-provider-preview
          persist-credentials: false

      - name: Ask DeepSeek for decisions
        if: steps.queue.outputs.events != '0' && env.MODEL == 'deepseek-flash'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Chosen after the read-only four-effort quality comparison (2026-10-31).
          DEEPSEEK_REASONING_EFFORT: max
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ]; then
            runner=".timeline-provider-preview/scripts/timeline-label-agent/run-deepseek.ts"
          else
            runner="scripts/timeline-label-agent/run-deepseek.ts"
          fi
          if [ ! -f "$runner" ]; then
            echo "::error::DeepSeek runner not found in selected revision: $runner"
            exit 1
          fi
          bun "$runner" labels/agent-input.json labels/proposals.json

      - name: Report a skipped run
        if: steps.queue.outputs.events == '0' || steps.model.outputs.limited == 'true'
        env:
          EVENTS: ${{ steps.queue.outputs.events }}
        run: |
          if [ "$EVENTS" = 0 ]; then why="empty queue, no model call"
          else why="Claude subscription limit reached or service busy; nothing written, the next run retries"; fi
          echo "## Timeline labels — skipped: $why" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeline-labels-proposals-${{ github.run_id }}
          path: labels/
          retention-days: 14
          if-no-files-found: ignore

  # Deterministic. No Claude token; the only job that can push.
  record:
    needs: propose
    if: needs.propose.outputs.events != '0' && needs.propose.outputs.limited != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: timeline-labels-proposals-${{ github.run_id }}
          path: ${{ runner.temp }}/labels

      - name: Record on fresh main and push
        id: record
        run: bash scripts/timeline-label-agent/record.sh "$RUNNER_TEMP/labels/proposals.json" "$TARGET_BRANCH" "$RUNNER_TEMP/reports"

      # A push with GITHUB_TOKEN starts no workflow, so CI is dispatched and awaited here.
      - name: Run CI on the recorded commit
        if: steps.record.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref "$TARGET_BRANCH"
          for _ in $(seq 1 30); do
            run="$(gh run list --workflow ci.yml --branch "$TARGET_BRANCH" --event workflow_dispatch \
              --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "${run:-}" ]; then echo "::error::Dispatched CI run not found"; exit 1; fi
          echo "CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          gh run watch "$run" --interval 30 --exit-status > /dev/null

      - name: Report
        if: always()
        run: |
          report="$RUNNER_TEMP/reports/accept-report.json"
          {
            if [ "$TARGET_BRANCH" = main ]; then where="main (deployed by the CI run above)"; else where="\`$TARGET_BRANCH\` (rehearsal, not deployed)"; fi
            echo "## Timeline labels — recorded on $where"
            echo
            echo "Recorded: ${{ steps.record.outputs.changed || 'no' }}"
            if [ -f "$report" ]; then
              echo
              jq -r '.outcomes | group_by(.outcome) | map("\(.[0].outcome): \(length)") | join(", ")' "$report" || true
              echo
              echo "| eventId | outcome | label / why |"
              echo "| --- | --- | --- |"
              jq -r '.outcomes[] | "| \(.eventId) | \(.outcome)\(if .decision then " \(.decision)" else "" end) | \((.timelineTitle // ((.why // "") + (if .proposed then " (proposed: \(.proposed))" else "" end))) | gsub("\\|"; "/")) |"' "$report" || true
              jq -r '.warnings[]? | "- warning: \(.)"' "$report" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeline-labels-record-${{ github.run_id }}
          path: ${{ runner.temp }}/reports/
          retention-days: 14
          if-no-files-found: ignore
