name: ZZZ P0 source access gate
on:
  pull_request:
    paths:
      - scripts/probe-zzz.ts
      - .github/workflows/zzz-source-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun scripts/probe-zzz.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zzz-p0-source-probe
          path: source-probes/zzz/
          retention-days: 7
