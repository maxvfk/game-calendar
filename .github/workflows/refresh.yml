name: Refresh sources

on:
  schedule:
    - cron: "27 5,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only — no requests or writes"
        type: boolean
        default: false
      only:
        description: "Refresh one source id (blank = all)"
        type: string
        default: ""
      force:
        description: "Ignore the 6h floor for this manual run"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.repository == 'maxvfk/game-calendar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile

      - name: Restore refresh bookkeeping
        uses: actions/cache/restore@v4
        with:
          path: snapshots/*.state.json
          key: refresh-state-
          restore-keys: refresh-state-

      - name: Refresh
        id: refresh
        env:
          REFRESH_CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          bun run refresh "${args[@]}"

      - name: Save refresh bookkeeping
        if: always()
        uses: actions/cache/save@v4
        with:
          path: snapshots/*.state.json
          key: refresh-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- snapshots)" ]; then
            git status --porcelain -- snapshots
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed snapshots
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- snapshots
          git commit -m "chore(data): refresh source snapshots"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish the refreshed feed
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$BRANCH"

      - name: Report source health
        if: always()
        env:
          BROKEN: ${{ steps.refresh.outputs.broken }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then exit 0; fi
          if [ -n "$BROKEN" ] && [ "$BROKEN" != "0" ]; then
            echo "::error::$BROKEN source(s) have stopped answering"
            exit 1
          fi
